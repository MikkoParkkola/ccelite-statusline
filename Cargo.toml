[package]
name = "ccstatusline"
version = "0.1.0"
edition = "2021"
description = "Ultra-fast statusline renderer for Claude Code"
authors = ["Mikko Parkkola"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4
