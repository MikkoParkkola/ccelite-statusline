name: CI

# Unconditional pull_request trigger — NO paths/paths-ignore filter (doctrine 3b).
# A path-filtered required check is SKIPPED on a docs-only PR → GitHub treats
# a skipped required check as unsatisfied → PR deadlocks forever.
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets

  # Dependency-vulnerability gate. This repo ships no release/publish workflow,
  # so this CI job IS the security gate: it fails the build on ANY known,
  # fixable vuln in the dependency tree. `--recursive ./` scans BOTH lockfiles —
  # ./Cargo.lock (the active Rust crate) AND ./legacy/ts/bun.lock (the legacy TS
  # tree, still externally published to npm as `ccstatusline`). Accepted/
  # unfixable vulns are time-boxed in .github/osv-scanner.toml (kept empty: the
  # fix for a fixable vuln is to bump the dep, not to ignore it). No Dockerfile,
  # so no trivy image scan is warranted.
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            ./
